<body><main><header>等你下课 · 去自习，好吗？</header><img src="assets/ink-dog-app-icon.png" alt="咖喱狗等你一起自习"><section><h1>下载安卓 App</h1><p id="status">最新版 1.2.2 · 2026年10月9日</p><p>线上／未排定课程显示在周课表下方，可以点开修改。下载按钮增加即时提示，优化 APK 的下载识别；保留上一版组件刷新与导入兼容修复。部分手机的下载及荣耀同学的导入仍需实际复测。</p><a id="download" href="./downloads/dengni-xiake-v1.2.2.apk" download="等你下课-v1.2.2.apk">下载 1.2.2</a><small>下载后直接覆盖安装，请保留原应用。收藏与偏好应当保留，覆盖更新效果请在手机上确认。</small></section><p><a href="./#settings">返回网页版</a></p></main>
<script>
const latestCode=8,latestVersion='1.2.2';
const raw=new URLSearchParams(location.search).get('versionCode');
const current=raw&&/^\d+$/.test(raw)?Number(raw):0;
if(Number.isSafeInteger(current)&&current>0){
 const title=document.querySelector('h1'),status=document.getElementById('status');
 if(current<latestCode){title.textContent='有新版本';status.textContent='可以更新到 '+latestVersion+'。';}
 else if(current===latestCode){title.textContent='已经是最新版';status.textContent='你已安装 '+latestVersion+'。';document.getElementById('download').textContent='重新下载 '+latestVersion;}
 else{title.textContent='无需降级';status.textContent='手机版本比网站提供的版本更新，请保留当前应用。';document.getElementById('download').hidden=true;}
}
const download=document.getElementById('download'),feedback=document.createElement('p');
feedback.id='download-feedback';feedback.setAttribute('role','status');feedback.setAttribute('aria-live','polite');
download.after(feedback);
let requested=false;
download.addEventListener('click',event=>{
 if(download.hidden||requested){event.preventDefault();return;}
 requested=true;
 feedback.textContent='已请求下载，请查看浏览器下载记录或通知栏。没有提示时，请用手机系统浏览器打开本页后重试。';
 download.textContent='已请求下载 · 请稍候';
 setTimeout(()=>{requested=false;download.textContent='再次下载 '+latestVersion;},5000);
});
</script></body></html>
